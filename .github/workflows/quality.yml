name: Platform quality checks

on:
  push:
    branches:
      - Platform
      - "fix/**"
  pull_request:
    branches:
      - Platform

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: npm run lint
      - name: Validate static build
        run: npm run build
      - name: Check local assets and JSON
        run: node scripts/check-assets.mjs

workflow_dispatch:
